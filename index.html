<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dina Mahmoud Ahmed Metwally - Identity Card</title>
    
    <style>
        /* ==========================================================================
           1. CSS VARIABLES (Colors, Sizes, and Spacing)
           ========================================================================== */
        :root {
            /* Physical dimensions for print and aspect ratio for screen */
            --card-width-physical: 85.6mm;
            --card-height-physical: 54mm;
            --card-radius-physical: 3.18mm;
            
            /* Color Palette */
            --color-metallic-blue-light: #3b6b9e;
            --color-metallic-blue-dark: #19335A;
            --color-accent-dark: #09172B;
            --color-accent-beige: #E6D8C3;
            --color-text-white: #FFFFFF;
            --color-text-muted: #B3C2D4;
            --color-bg-page: #F4F1EA;
            
            /* Typography */
            --font-main: 'Inter', system-ui, -apple-system, sans-serif;
            
            /* Spacing (using container query inline units to scale perfectly) */
            --spacing-sm: 1.5cqi;
            --spacing-md: 3cqi;
            --spacing-lg: 5cqi;
        }

        /* ==========================================================================
           2. BASE RESETS & TYPOGRAPHY
           ========================================================================== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-main);
            background-color: var(--color-bg-page);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: var(--color-text-white);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Accessibility: Visible focus outline for keyboard navigation */
        a:focus-visible, button:focus-visible {
            outline: 3px solid var(--color-accent-beige);
            outline-offset: 4px;
            border-radius: 4px;
        }

        /* ==========================================================================
           3. CARD CONTAINER & 3D ENVIRONMENT
           ========================================================================== */
        .card-scene {
            /* Creates the 3D space for the tilt effect */
            perspective: 1200px;
            width: 100%;
            max-width: 500px;
            display: flex;
            justify-content: center;
            margin-bottom: 2rem;
        }

        .card {
            /* Container queries allow all internal text/padding to scale proportionally */
            container-type: inline-size;
            container-name: card;
            
            /* Responsive sizing maintaining standard CR80 credit card aspect ratio */
            width: 100%;
            aspect-ratio: 85.6 / 54;
            position: relative;
            
            /* Material rendering */
            background: linear-gradient(135deg, var(--color-metallic-blue-light) 0%, var(--color-metallic-blue-dark) 100%);
            border-radius: calc(var(--card-width-physical) * 0.037); /* ~3.18mm proportionally */
            box-shadow: 
                0 25px 50px -12px rgba(9, 23, 43, 0.5),
                0 10px 20px -5px rgba(9, 23, 43, 0.3);
            
            /* Smooth return transition when mouse leaves */
            transition: transform 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            transform-style: preserve-3d;
            
            /* Hide overflow for clean rounded corners */
            overflow: hidden;
            
            /* Allow JS to track internal cursor position for dynamic lighting */
            --light-x: 50%;
            --light-y: 50%;
        }

        /* Thin lighter edge and structural overlay */
        .card::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            /* Inner top white line for edge highlight, inner bottom dark line for depth */
            box-shadow: inset 0 1.5px 1px rgba(255, 255, 255, 0.4), 
                        inset 0 -1.5px 1px rgba(0, 0, 0, 0.3);
            pointer-events: none;
            z-index: 10;
        }

        /* Dynamic surface sheen responding to mouse movement */
        .card::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background: radial-gradient(
                circle at var(--light-x) var(--light-y),
                rgba(255, 255, 255, 0.2) 0%,
                transparent 60%
            );
            pointer-events: none;
            z-index: 11;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .card-scene:hover .card::before {
            opacity: 1; /* Show sheen only on hover */
        }

        /* ==========================================================================
           4. INTERNAL CARD LAYOUT
           ========================================================================== */
        .card-content {
            display: flex;
            width: 100%;
            height: 100%;
            padding: var(--spacing-lg);
            position: relative;
            z-index: 2; /* Sit above background, below sheen */
            gap: var(--spacing-md);
        }

        /* Left Column: Identity */
        .col-left {
            flex: 1.1;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            padding-right: var(--spacing-sm);
        }

        /* Right Column: Contact & Social */
        .col-right {
            flex: 0.9;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border-left: 1px solid rgba(255, 255, 255, 0.15);
            padding-left: var(--spacing-md);
        }

        /* ==========================================================================
           5. PROFILE PHOTO & FALLBACK
           ========================================================================== */
        .photo-wrap {
            width: 26cqi; /* Scales to roughly 22mm on standard print */
            aspect-ratio: 1;
            border-radius: 4.5cqi; /* Soft rounded square */
            overflow: hidden;
            background-color: var(--color-accent-dark);
            border: 0.3cqi solid rgba(230, 216, 195, 0.4);
            margin-bottom: var(--spacing-md);
            flex-shrink: 0;
            position: relative;
        }

        .photo-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .photo-fallback {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--color-accent-dark);
            color: var(--color-accent-beige);
            font-size: 9cqi;
            font-weight: 700;
            letter-spacing: 1px;
        }

        /* ==========================================================================
           6. TEXT STYLES & HIERARCHY
           ========================================================================== */
        .name {
            font-size: 5cqi;
            font-weight: 700;
            color: var(--color-accent-beige);
            line-height: 1.15;
            margin-bottom: var(--spacing-sm);
            margin-top: auto; /* Pushes text down slightly to balance */
        }

        .title {
            font-size: 3.2cqi;
            font-weight: 500;
            color: var(--color-text-white);
            line-height: 1.2;
            margin-bottom: 0.5cqi;
        }

        .org {
            font-size: 2.5cqi;
            font-weight: 400;
            color: var(--color-text-muted);
            line-height: 1.2;
        }

        /* Contact Details */
        .info-group {
            margin-bottom: 2.5cqi;
        }

        .info-group:last-of-type {
            margin-bottom: 0;
        }

        .info-label {
            display: block;
            font-size: 1.8cqi;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--color-accent-beige);
            opacity: 0.8;
            margin-bottom: 0.5cqi;
        }

        .info-val {
            display: block;
            font-size: 3cqi;
            color: var(--color-text-white);
            text-decoration: none;
            line-height: 1.3;
            word-wrap: break-word;
            position: relative; /* For touch target */
        }

        /* ==========================================================================
           7. INTERACTIVITY & MOBILE ACCESSIBILITY
           ========================================================================== */
        /* Ensure links meet minimum tap target size (44x44px) without breaking visual layout */
        @media screen {
            .touch-target::after {
                content: '';
                position: absolute;
                top: 50%;
                left: -10px;
                right: -10px;
                transform: translateY(-50%);
                min-height: 44px;
                z-index: 5;
            }
        }

        /* Social Icons */
        .socials {
            display: flex;
            gap: 2.5cqi;
            align-items: center;
            margin-top: auto; /* Push to bottom */
        }

        .social-link {
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--color-text-white);
            transition: color 0.2s, transform 0.2s;
            position: relative; /* For touch target */
        }

        .social-link svg {
            width: 4.5cqi;
            height: 4.5cqi;
            fill: currentColor;
            display: block;
        }

        .social-link:hover, .social-link:focus-visible {
            color: var(--color-accent-beige);
            transform: translateY(-10%);
        }

        /* Greyed out unavailable accounts */
        .social-greyed {
            color: rgba(255, 255, 255, 0.25);
            cursor: not-allowed;
        }

        /* Print Button */
        .print-btn {
            background-color: var(--color-accent-dark);
            color: var(--color-text-white);
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 500;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: background-color 0.2s, transform 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .print-btn:hover {
            background-color: #122849;
            transform: translateY(-2px);
        }

        /* ==========================================================================
           8. PRINT QUALITY STYLES
           ========================================================================== */
        @media print {
            /* Reset the page completely */
            @page {
                size: auto;
                margin: 0; 
            }
            body {
                background: none;
                margin: 0;
                padding: 0;
                display: block;
            }

            /* Hide everything that is NOT the card */
            body > *:not(.card-scene) {
                display: none !important;
            }

            .card-scene {
                perspective: none; /* Disable 3D */
                margin: 0;
                padding: 0;
                max-width: none;
                display: block;
            }

            /* Force exact physical dimensions and render background graphics */
            .card {
                width: var(--card-width-physical) !important;
                height: var(--card-height-physical) !important;
                margin: 0 !important;
                transform: none !important;
                box-shadow: none !important;
                /* Essential for printing backgrounds in WebKit/Blink */
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
                page-break-inside: avoid;
            }

            /* Remove screen-only effects */
            .card::before, .card::after {
                display: none !important;
            }
            .print-btn {
                display: none !important;
            }
        }
    </style>

    <!-- JAVASCRIPT: 3D Mouse interactions -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const scene = document.getElementById('scene');
            const card = document.getElementById('card');
            
            // Respect user's system preferences for motion
            const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

            scene.addEventListener('mousemove', (e) => {
                if (prefersReducedMotion.matches) return;

                const rect = card.getBoundingClientRect();
                
                // Calculate cursor position relative to the card (0 to 1)
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                
                // Calculate position relative to the center of the card
                const centerX = rect.width / 2;
                const centerY = rect.height / 2;
                
                // Calculate rotation (max 8 degrees tilt for readability)
                const rotateX = ((y - centerY) / centerY) * -8;
                const rotateY = ((x - centerX) / centerX) * 8;
                
                // Apply 3D rotation
                card.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
                
                // Move the lighting reflection (sheen) with the mouse
                const lightX = (x / rect.width) * 100;
                const lightY = (y / rect.height) * 100;
                card.style.setProperty('--light-x', `${lightX}%`);
                card.style.setProperty('--light-y', `${lightY}%`);
            });

            // Smoothly settle the card back to flat when mouse leaves
            scene.addEventListener('mouseleave', () => {
                if (prefersReducedMotion.matches) return;
                card.style.transform = `rotateX(0) rotateY(0)`;
                // Sheen fades out automatically via CSS hover state
            });
        });
    </script>
